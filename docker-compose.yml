services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - RUST_LOG=jsondev=info
    # mount for live-reload during local dev (overrides baked-in copies)
    volumes:
      - ./content:/app/content:ro
      - ./data:/app/data:ro
      - ./templates:/app/templates:ro
      - ./static:/app/static:ro
