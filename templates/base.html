<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}jsondev{% endblock %}</title>
  <meta name="description" content="{% block description %}personal notes, blog, and recipes{% endblock %}">
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="/" class="site-title">jsondev</a>
      <nav class="site-nav">
        <ul class="nav-links">
          <li><a href="/blog">blog</a></li>
          <li><a href="/notes">notes</a></li>
          <li><a href="/recipes">recipes</a></li>
          <li><a href="/workouts">workouts</a></li>
          <li><a href="/bookshelf">bookshelf</a></li>
        </ul>
        <button class="theme-toggle" id="theme-toggle" title="toggle theme" aria-label="toggle theme">
          <svg class="moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <svg class="sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block main %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      Jason Devers &middot; 2026
    </div>
  </footer>

  <script src="/static/js/copy-code.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"
    onload="renderMathInElement(document.body, {
      delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ]
    });"></script>
  <script type="module">
    import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
    // pulldown-cmark outputs <pre><code class="language-mermaid"> -- adapt for mermaid
    document.querySelectorAll('code.language-mermaid').forEach(el => {
      const pre = el.parentElement;
      pre.classList.add('mermaid');
      pre.innerHTML = el.textContent;
    });
    mermaid.initialize({ startOnLoad: true });
  </script>
  <script>
    (function() {
      const toggle = document.getElementById('theme-toggle');
      const body = document.body;
      const stored = localStorage.getItem('theme');
      if (stored === 'dark') body.classList.add('dark');
      else if (stored === 'light') body.classList.add('light');
      toggle.addEventListener('click', function() {
        const isDark = body.classList.contains('dark') ||
          (!body.classList.contains('light') && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          body.classList.replace('dark', 'light') || body.classList.add('light');
          localStorage.setItem('theme', 'light');
        } else {
          body.classList.replace('light', 'dark') || body.classList.add('dark');
          localStorage.setItem('theme', 'dark');
        }
      });
    })();
  </script>
</body>
</html>
